name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-24.04
    # Postgres de teste, a mesma imagem e versão do dev. A senha é descartável e não é segredo.
    # O pg_isready com -h localhost só responde quando o servidor final aceita TCP.
    services:
      postgres:
        image: supabase/postgres:17.6.1.173
        env:
          POSTGRES_PASSWORD: teste-ci-descartavel
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detectar mudança só de documentação
        id: escopo
        run: |
          base=$(git merge-base origin/main HEAD)
          alterados=$(git diff --name-only "$base" HEAD)
          echo "Arquivos alterados contra a main:"
          echo "$alterados"
          if [ -z "$alterados" ]; then
            echo "Nenhum arquivo alterado contra a main. Roda tudo."
            echo "so_documentacao=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          so_documentacao=true
          while IFS= read -r arquivo; do
            case "$arquivo" in
              docs/*) ;;
              *.md) ;;
              *) so_documentacao=false ;;
            esac
          done <<< "$alterados"
          echo "so_documentacao=$so_documentacao" >> "$GITHUB_OUTPUT"
          echo "Mudança só de documentação: $so_documentacao"

      - name: Instalar o Node
        if: steps.escopo.outputs.so_documentacao != 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"

      - name: Instalar o pnpm
        if: steps.escopo.outputs.so_documentacao != 'true'
        uses: pnpm/action-setup@v6.1.0

      - name: Instalar as dependências
        if: steps.escopo.outputs.so_documentacao != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.escopo.outputs.so_documentacao != 'true'
        run: pnpm -r build

      - name: Lint
        if: steps.escopo.outputs.so_documentacao != 'true'
        run: pnpm -r lint

      - name: Checagem de tipos
        if: steps.escopo.outputs.so_documentacao != 'true'
        run: pnpm -r typecheck

      - name: Testes
        if: steps.escopo.outputs.so_documentacao != 'true'
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:54322/postgres
          TEST_DATABASE_PASSWORD: teste-ci-descartavel
        run: pnpm -r test

      - name: Formatação
        if: steps.escopo.outputs.so_documentacao != 'true'
        run: pnpm format:check

      - name: smoke-compose
        if: steps.escopo.outputs.so_documentacao != 'true'
        run: |
          set -euo pipefail

          echo "== DoD 1 — o compose só declara api e caddy =="
          servicos=$(docker compose config --services | sort | paste -sd' ' -)
          echo "$servicos"
          test "$servicos" = "api caddy"

          echo "== DoD 7 — orçamento de memória dos dois serviços =="
          docker compose config | grep -E '^[[:space:]]*mem_limit:'
          docker compose config | awk '
            /^[[:space:]]*mem_limit:/ {
              valor = $2
              gsub(/"/, "", valor)
              fator = 1
              if (valor ~ /[gG]$/) fator = 1024 * 1024 * 1024
              else if (valor ~ /[mM]$/) fator = 1024 * 1024
              else if (valor ~ /[kK]$/) fator = 1024
              gsub(/[^0-9]/, "", valor)
              total += valor * fator
              n += 1
            }
            END {
              printf "servicos_com_mem_limit=%d total_bytes=%d\n", n, total
              if (n != 2) exit 1
              if (total > 1073741824) exit 1
            }'

          echo "== DoD 8 — nenhum segredo do .env entra na imagem =="
          ! grep -nE '^[[:space:]]*(COPY|ADD)[^#]*\.env' apps/api/Dockerfile infra/caddy/Dockerfile
          ! grep -nE '^[[:space:]]*ARG[[:space:]]' apps/api/Dockerfile infra/caddy/Dockerfile
          echo "nenhuma ocorrência de COPY .env nem de ARG nos dois Dockerfiles"

          echo "== DoD 3 — a pilha sobe com os dois serviços saudáveis =="
          docker compose up -d --build --wait --wait-timeout 300

          echo "== DoD 4 — o web estático responde na raiz do domínio padrão =="
          curl -f -s http://localhost/

          echo "== DoD 5 — a API responde no subdomínio do mesmo domínio =="
          test "$(curl -f -s -H 'Host: api.localhost' http://localhost/)" = "ok"

          echo "== DoD 9 — o down não deixa nada residual =="
          docker compose down
          restantes=$(docker compose ps -a --format '{{.Name}}')
          test -z "$restantes"
          echo "docker compose ps -a vazio para o projeto"
